[package]
name = "ftp-s3"
version = "0.1.0"
authors = ["Bruno Arueira <contato@brunoarueira.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
suppaftp = { version = "^8", features = ["tokio", "tokio-rustls-ring"] }
futures = "*"
futures-util = "*"
lazy_static = "1.4.0"
"aws-sdk-s3" = { version = "1.140.0", default-features = false, features = ["rt-tokio", "http-1x", "sigv4a", "default-https-client"] }
"aws-config" = "*"
hyper = { version = "0.14", features = ["stream"] }
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["full"] }
